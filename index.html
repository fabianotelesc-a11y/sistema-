/* Ferramenta de trabalho: barra navy, coluna lateral fixa com paciente e totais, refeições à direita */
:root { --navy:#091C2D; --navy2:#1F4566; --sky:#AFC1D6; --tint:#F7F7F7; --tint2:#EFEFEF; --line:#D7D7D7; --ink:#141414; --muted:#5C5C5C; --white:#fff; --ok:#1E7A4C; --bad:#B4372B;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--tint); color: var(--ink); font: 14px/1.45 var(--font); }
/* ---- moldura (etapa 1 do redesign): barra lateral azul no computador, barra inferior com "Mais" no celular ---- */
:root { --menu-w: 232px; --topo: 0px; }

.brand b { font-size: 17px; font-weight: 300; letter-spacing: .08em; }
#nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
#nav a, #nav .nav-mais, #nav .user button, .top .sino { position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; border-radius: 6px; background: none; color: rgba(255,255,255,.62); font: 500 14px/1.2 var(--font); text-decoration: none; cursor: pointer; transition: color .15s, background .15s; opacity: 1; }

.top .sino.aberto { color: var(--white); background: rgba(255,255,255,.06); }

.top .sino { width: 100%; } .top .sino::after { content: "Avisos"; }

/* trilho de ícones (telas médias) */
@media (min-width: 961px) and (max-width: 1199px) {

  #nav a.on::before { left: -12px; }

}
/* celular: topo fino com a marca e o sino; menu fixo embaixo */

  .brand { padding: 0; } .brand-ft { width: 28px; height: 28px; }
  #nav { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--navy); border-top: 1px solid rgba(255,255,255,.08); }
  #nav.sem-mais { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }

  #nav a.nv-g { margin-top: 0; }

  #nav .nav-mais.on { color: var(--white); } #nav.mais-aberto a.sec.on::before { display: none; } #nav.mais-aberto a.sec.on { background: rgba(255,255,255,.09); }

  #nav.sem-mais .user { display: flex; margin: 0; padding: 0; border: 0; } #nav.sem-mais #eu { display: none; }
  #nav .selo { position: absolute; top: 2px; left: calc(50% + 4px); margin: 0; min-width: 17px; padding: 0 4px; font-size: 10px; line-height: 16px; }
  /* o sino fica no topo, à direita */
  .top .sino { position: fixed; z-index: 41; top: 8px; right: max(10px, env(safe-area-inset-right, 0px)); width: auto; padding: 10px; color: var(--white); }
  .top .sino::after { display: none; } .top .sino .sino-n { position: absolute; top: 2px; right: 2px; min-width: 17px; padding: 0 4px; font-size: 10px; line-height: 16px; }
  /* "Mais" aberto: os outros itens sobem como uma lista acima da barra */

  #nav.mais-aberto .user button { flex-direction: row; justify-content: flex-start; gap: 14px; padding: 13px 14px; font-size: 15px; }
  #nav.mais-aberto #eu { display: block; padding: 4px 14px; }
  #nav.mais-aberto .nav-mais { color: var(--white); }
  body:has(#nav.mais-aberto)::after { content: ""; position: fixed; inset: 0; z-index: 29; background: rgba(9,28,45,.45); }
  #toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
}

@media (max-width: 900px) { .side { position: static; max-height: none; } }

/* anamneses recebidas */

.passos { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: p; }

.prod .kpis { margin: 4px 0 16px; } .prod .box { margin-bottom: 16px; }
.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 12px; }
.prod-card { background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 14px; color: var(--ink); text-decoration: none; display: flex; flex-direction: column; gap: 10px; }
.prod-card:hover { border-color: var(--navy); }
.prod-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .prod-h b { font-size: 17px; color: var(--navy); }
.prod-dl { margin: 0; display: flex; flex-direction: column; gap: 6px; } .prod-dl div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding-bottom: 5px; }

.prod .ok { color: var(--ok); } .prod .meio { color: #C98A1B; } .prod .ruim { color: var(--bad); }
.prod-gargalos, .prod-lista, .prod-linha { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.prod-linha { list-style: none; padding: 0; max-height: 420px; overflow: auto; } .prod-linha time { color: var(--muted); font-size: 12px; display: inline-block; min-width: 90px; font-variant-numeric: tabular-nums; }

.pc-l.sem .pc-b i { background: #C98A1B; }
.prod-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .prod-2 .box { margin-bottom: 0; } .prod-2 { margin-bottom: 16px; }
@media (max-width: 800px) { .prod-2 { grid-template-columns: 1fr; } .pc-l { grid-template-columns: 100px 1fr 30px; } }
.prod-pacs { line-height: 1.8; }
/* Alimentos da equipe */
.tag-eq { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .03em; background: #E4ECF7; color: var(--navy); padding: 1px 6px; border-radius: 8px; margin-left: 4px; white-space: nowrap; }
.al-form { max-width: 760px; } .al-form .panel { margin-bottom: 12px; } .al-form .seg, .page .filtros .seg { flex-wrap: wrap; } .al-form .seg label, .filtros .seg label { flex-direction: row; }
.al-num { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 700px) { .al-num { grid-template-columns: repeat(2, minmax(0, 1fr)); } .al-num label:first-child { grid-column: 1 / -1; } .al-form .row3 { grid-template-columns: 1fr; } }
.al-form label.conf input { background: #FFF6CC; border-color: #E2B93B; }
.al-ing { display: flex; gap: 8px; align-items: flex-end; padding: 4px 0; } .al-ing .g { width: 90px; flex: none; }
.al-foto { align-self: flex-start; cursor: pointer; } .al-foto.carregando { opacity: .7; pointer-events: none; }
.al-prev { background: var(--tint); } .al-l { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; } .al-l span:first-child { min-width: 150px; color: var(--muted); font-size: 13px; }
.al-falta { color: var(--bad); }
.al-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
/* Hoje, olhe estas pessoas (Painel) */
.hoje-box { border-left: 4px solid var(--navy); }
.hoje-l { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; } .hoje-l:last-of-type { border-bottom: none; }
.hoje-l.chamado { opacity: .55; }
.hoje-n { width: 24px; height: 24px; border-radius: 50%; background: var(--tint2); color: var(--navy); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.hoje-t { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 200px; } .hoje-t a { color: var(--navy); text-decoration: none; } .hoje-m { font-size: 13px; color: var(--ink); }
.hoje-a { display: flex; gap: 6px; flex: none; }
/* Linha do tempo (ficha) */
.tl { list-style: none; margin: 0; padding: 0 0 0 4px; display: flex; flex-direction: column; }
.tl-mes { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 0 4px; }
.tl-i { display: flex; gap: 12px; padding: 6px 0 6px 14px; border-left: 2px solid var(--line); position: relative; }
.tl-i::before { content: ''; position: absolute; left: -6px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--navy)); }
.tl-i .tl-d { font-size: 12px; color: var(--muted); min-width: 40px; padding-top: 1px; } .tl-i div { display: flex; flex-direction: column; gap: 1px; min-width: 0; } .tl-i b { font-size: 14px; color: var(--ink); font-weight: 600; } .tl-i small { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tl-reg { --c: #4A7FB5; } .tl-dieta { --c: var(--navy); } .tl-rel { --c: var(--ok); } .tl-cons { --c: #8A5A00; } .tl-corpo { --c: #7A5C2E; } .tl-plano { --c: var(--sky); }
.tl-f { margin: 0; } .tl-f .chip { cursor: pointer; }
@media (max-width: 700px) { .hoje-a { width: 100%; padding-left: 36px; } }
/* ficha → Registro do dia (Fase 2) */
.reg-sem { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 2px 0 10px; font-size: 13px; }
.reg-m { background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--ink); } .reg-m b { color: var(--navy); }
.reg-m.ok { border-color: var(--ok); } .reg-m.ok b { color: var(--ok); }
.metas-f { background: var(--bg, #F6F7F9); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.metas-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; margin: 8px 0; }
.metas-g label { font-size: 12px; } .metas-g input { width: 100%; }
.reg-g { font-size: 12px; } .reg-g th, .reg-g td { text-align: center; padding: 5px 4px; white-space: nowrap; } .reg-g tbody th { text-align: left; font-weight: 600; color: var(--muted); }
.reg-g th, .reg-g thead th { background: none; } .reg-g thead th { font-weight: 500; color: var(--muted); line-height: 1.15; border-bottom: 1px solid var(--line); } .reg-g thead small { display: block; font-size: 10px; } .reg-g th.hj { color: var(--navy); font-weight: 700; } .reg-g th.ini-sem { border-left: 1px solid var(--line); }
.reg-g td.ok { color: var(--ok); font-weight: 700; } .reg-g td.vz { color: #C4CAD3; }
.pratos-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
.prato-c { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.prato-img { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; border-radius: 8px; background: var(--line) center / cover no-repeat; font-size: 11px; color: var(--muted); text-decoration: none; text-align: center; padding: 4px; }
.prato-c figcaption { display: flex; flex-direction: column; font-size: 12px; } .prato-c small { color: var(--muted); overflow-wrap: anywhere; }
/* ---- Padrão de todas as telas (etapa 7 do redesign) ----
   Os componentes antigos (.btn, .box, .tabs, .tabela, .kpi, campos) ganham o visual do Design System.
   Fica ANTES das regras das telas já redesenhadas (Painel, Ficha, Pacientes, Montador), que continuam valendo. */
.page { gap: 16px; padding-top: 24px; }
.page-h { align-items: flex-end; }
.page-h h1 { margin: 0 0 4px; font-size: 28px; font-weight: 300; line-height: 1.2; color: var(--ft-texto); }
.page-h .hint { max-width: 760px; font-size: 14px; line-height: 1.5; color: var(--ft-texto-2); }
.page-h .link { display: inline-block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--ft-texto-2); }
.page-h .link:hover { color: var(--ft-texto); }
.link { color: var(--ft-azul); }
.page a:not([class]) { color: var(--ft-azul); text-underline-offset: 3px; } /* links de texto no azul da marca (antes: azul do navegador) */
.hint, .empty { color: var(--ft-texto-3); }
/* botões */
.primary, .btn, .danger { border-radius: var(--ft-r-campo); transition: background .15s, color .15s, border-color .15s; }
.btn { border-color: var(--ft-linha); color: var(--ft-texto); background: var(--ft-superficie); }
.btn:hover { border-color: var(--ft-texto-3); background: var(--ft-fundo); }
.primary, .btn.primary { background: var(--ft-azul); border-color: var(--ft-azul); color: var(--white); }
.primary:hover, .btn.primary:hover { background: var(--ft-azul-2); border-color: var(--ft-azul-2); }
.btn.sm { padding: 5px 11px; font-size: 12px; }
.danger { background: transparent; color: var(--ft-erro); border: 1px solid var(--ft-linha); }
.danger:hover { background: var(--ft-erro-fundo); border-color: var(--ft-erro); }
/* caixas */
.box, .panel { border-color: var(--ft-linha-suave); border-radius: var(--ft-r-card); }
.box { padding: 20px 22px; gap: 12px; }
.box > h2, .box-h h2, .panel > h2 { font-size: 11px; letter-spacing: .14em; color: var(--ft-texto); }
.card-center { border-color: var(--ft-linha-suave); border-radius: var(--ft-r-card); padding: 32px; }
.card-center h1 { font-weight: 400; color: var(--ft-texto); }
/* abas curtas (Agenda, Financeiro, Comercial…): controle segmentado */
.tabs { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: var(--ft-r-campo); background: var(--ft-linha-suave); }
.tabs a, .fin-bar .tabs button, .ag-f .tabs button { padding: 6px 14px; border: 0; border-radius: 4px; background: transparent; color: var(--ft-texto-2); font-weight: 500; font-size: 13px; }
.tabs a:hover, .fin-bar .tabs button:hover, .ag-f .tabs button:hover { color: var(--ft-texto); }
.tabs a.on, .fin-bar .tabs button.on, .ag-f .tabs button.on { background: var(--ft-superficie); color: var(--ft-azul); font-weight: 600; box-shadow: var(--ft-sombra-1); }
/* tabelas: cabeçalho em rótulo cinza, linhas finas */
.tabela-wrap { border-color: var(--ft-linha-suave); border-radius: var(--ft-r-card); }
.tabela th { background: transparent; color: var(--ft-texto-3); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 11px 12px; border-bottom: 1px solid var(--ft-linha); }
.tabela td { padding: 11px 12px; border-bottom-color: var(--ft-linha-suave); }
.tabela tr[data-href]:hover td { background: var(--ft-fundo); }
.tabela a { color: var(--ft-texto); }
/* números */
.kpi { border: 1px solid var(--ft-linha-suave); border-radius: var(--ft-r-card); padding: 16px 18px; gap: 6px; }
.kpi b { font-weight: 300; color: var(--ft-azul); }
.kpi span { font-size: 12px; color: var(--ft-texto-2); }
.kpi.warn { border-top-color: var(--ft-linha-suave); } .kpi.warn b { color: var(--ft-alerta); }
.kpi.neg { border-top-color: var(--ft-linha-suave); } .kpi.neg b { color: var(--ft-erro); }
.kpi.pos { border-top-color: var(--ft-linha-suave); } .kpi.pos b { color: var(--ft-ok); }
a.kpi:hover { border-color: var(--ft-linha); }
/* chips de período/filtro */
.chip { border-color: var(--ft-linha); border-radius: var(--ft-r-pilula); color: var(--ft-texto-2); background: var(--ft-superficie); }
.chip.on, .chip[aria-pressed="true"] { background: var(--ft-azul); border-color: var(--ft-azul); color: var(--white); }
/* campos */
input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]), select, textarea { border-color: var(--ft-linha); border-radius: var(--ft-r-campo); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ft-azul); box-shadow: 0 0 0 3px rgba(9,28,45,.08); }
label { color: var(--ft-texto-2); }
@media (max-width: 640px) { input:not([type=checkbox]):not([type=radio]), select, textarea { font-size: 16px; } .page-h h1 { font-size: 24px; } .box { padding: 16px; } }
/* ---- Painel (etapa 2 do redesign): Agora · Números · Fila ---- */
/* status em todo o sistema: as cores do Design System (antes eram tons soltos) */
.badge { border-radius: var(--ft-r-pilula); padding: 2px 10px; }
.badge.ativo { background: var(--ft-ok-fundo); color: var(--ft-ok); }
.badge.vencendo { background: var(--ft-alerta-fundo); color: var(--ft-alerta); }
.badge.baixa { background: var(--ft-erro-fundo); color: var(--ft-erro); }
.badge.inativo { background: var(--ft-linha-suave); color: var(--ft-texto-2); }
.badge.futuro { background: var(--ft-info-fundo); color: var(--ft-azul); }
.dif.ok { background: var(--ft-ok-fundo); color: var(--ft-ok); } .dif.bad { background: var(--ft-erro-fundo); color: var(--ft-erro); }
.okmsg { background: var(--ft-ok-fundo); color: var(--ft-ok); border-radius: var(--ft-r-campo); font-size: 13px; }
.painel { gap: 14px; padding-top: 28px; }
.painel-h { align-items: flex-end; }
.painel-h h1 { margin: 6px 0 8px; font-size: 28px; font-weight: 300; color: var(--ft-texto); }
.painel-resumo { margin: 0; display: flex; flex-wrap: wrap; row-gap: 2px; color: var(--ft-texto-2); font-size: 14px; }
.painel-resumo span { white-space: nowrap; } .painel-resumo span:not(:last-child)::after { content: "·"; margin: 0 10px; color: var(--ft-texto-3); } /* o ponto fica no fim da linha, nunca no começo */
.faixa { margin: 16px 0 -4px; display: flex; align-items: center; gap: 12px; font: 600 11px/1.3 var(--ft-fonte); letter-spacing: .14em; text-transform: uppercase; color: var(--ft-texto-3); }
.faixa::after { content: ""; flex: 1; height: 1px; background: var(--ft-linha-suave); }
.painel-agora { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.painel-lado { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 1279px) { .painel-agora { grid-template-columns: 1fr; } }
.painel .box { border-color: var(--ft-linha-suave); border-radius: var(--ft-r-card); padding: 20px 22px; gap: 12px; }
.painel .box-h h2 { font-size: 11px; letter-spacing: .14em; color: var(--ft-texto); }
.painel .box-h .muted { font-size: 12px; color: var(--ft-texto-3); }
.painel .an-box, .painel .relp-painel, .painel #ret-slot .box { margin: 0; }
.painel .hint { color: var(--ft-texto-3); }
.painel .hoje-t a, .painel .rp-q a, .painel .t-q a, .painel .an-l b { color: var(--ft-texto); text-decoration: none; }
@media (hover: hover) { .painel .hoje-t a:hover b, .painel .rp-q a:hover b, .painel .t-q a:hover { text-decoration: underline; text-underline-offset: 3px; } }
/* uma cor forte por vez: ação principal com contorno azul, as outras discretas */
.painel .btn { border-radius: var(--ft-r-campo); transition: background .15s, color .15s, border-color .15s; }
.painel .btn.sm { padding: 5px 11px; font-size: 12px; }
.painel .btn.sm.primary { background: var(--ft-superficie); color: var(--ft-azul); border-color: var(--ft-azul); }
